spec: plane-http-api
source: Plane v1.4.2 Django/DRF backend (apps/api/plane)
purpose: Exhaustive HTTP API inventory for a Django -> Go/PocketBase migration
method: Paths extracted programmatically from all urls.py files; methods/view_class derived from
  as_view() action maps and view-class method definitions; request/response shapes enriched by
  reading views + serializers. called_by_frontend determined by grepping packages/services/src
  (plus apps/web for direct fetch calls).
auth_values: session=CSRF+cookie (main UI) | api_token=Bearer (api/v1) | public=no auth | admin=instance superuser
